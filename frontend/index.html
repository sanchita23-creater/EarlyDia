<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EarlyDia - an ML-based diabetes-related screening prototype built on NFHS-5 survey data for adults aged 18-40." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>EarlyDia | Diabetes-related screening</title>
    <script>
      try {
        var t = localStorage.getItem("earlydia-theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
